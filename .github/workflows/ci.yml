name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: lint + unit tests (no Ollama)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests experiments examples
      - name: Unit tests
        run: pytest -m unit --timeout=120
      - name: Real-world protocol tests (corpus builder, causality, driver)
        run: pytest -m real_world --timeout=120
      - name: Smoke the pipeline end to end (statistics only)
        run: |
          python -m smartgate dataset --n 50 --out artifacts/ci_dataset.jsonl
          python -m smartgate sweep --dataset artifacts/ci_dataset.jsonl

  integration:
    name: integration with a live Qwen3 on Ollama
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Start server and pull the smoke model
        run: |
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://localhost:11434/api/version && break; sleep 2; done
          ollama pull qwen3:0.6b
      - name: Runtime doctor
        run: python -m smartgate doctor --model qwen3:0.6b
      - name: Integration tests
        env:
          SMARTGATE_MODEL: qwen3:0.6b
        run: pytest -m integration --timeout=900
